    <script>
      // Gracefully ignore WebSocket / HMR runner errors in preview sandbox
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        if (
          typeof msg === 'string' &&
          (msg.includes('WebSocket') ||
            msg.includes('createWebSocketModuleRunnerTransport') ||
            msg.includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = String((event && event.reason) || '');
        if (
          reason.includes('WebSocket') ||
          reason.includes('createWebSocketModuleRunnerTransport') ||
          reason.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>

  </body>
